<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>wait fixture</title>
    <script>
      // 每个条件都在 400 ms 之后才成立,用例据此确认 wait 真的等过。
      setTimeout(() => {
        const late = document.createElement("p");
        late.id = "late";
        late.textContent = "Late arrival";
        document.body.append(late);
        document.getElementById("going").remove();
        document.getElementById("reveal").style.display = "block";
        document.getElementById("hide-me").style.display = "none";
        history.pushState(null, "", "?done=1");
      }, 400);
    </script>
  </head>
  <body>
    <p id="going">Going soon</p>
    <p id="reveal" style="display: none">Now visible</p>
    <p id="hide-me">Hides itself</p>
    <p style="display: none">Never shown</p>
  </body>
</html>
