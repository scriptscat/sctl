<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>oopif fixture</title>
  </head>
  <body>
    <button type="button">Top button</button>
    <iframe title="Cross frame" id="cross"></iframe>
    <script>
      // 同一个测试服务器换一个主机名就是另一个站点:Chrome 把它放进独立进程(OOPIF)。
      window.loaded = [];
      window.addEventListener("message", (e) => window.loaded.push(e.data));
      document.getElementById("cross").src = `http://localhost:${location.port}/oopif-child.html`;
    </script>
  </body>
</html>
