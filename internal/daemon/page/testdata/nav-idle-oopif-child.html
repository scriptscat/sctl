<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>nav idle oopif child</title>
    <script>
      // load 之后 200 ms 才发出一个要 1.5 s 才返回的请求:只有把 iframe 的请求也算进去的 networkidle 会等它。
      addEventListener("load", () => {
        setTimeout(() => fetch("/slow?fetch").then(() => parent.postMessage("fetched", "*")), 200);
      });
    </script>
  </head>
  <body>
    <p>Fetching later in a cross-site frame.</p>
  </body>
</html>
