<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dialog fixture</title>
  </head>
  <body>
    <button type="button" id="alert" onclick="alert('hello <alert>'); window.alerted = true">Alert</button>
    <button type="button" id="confirm" onclick="window.confirmed = confirm('really?')">Confirm</button>
    <button type="button" id="prompt" onclick="window.answer = prompt('name?', 'default')">Prompt</button>
    <button type="button" id="arm">Arm</button>
    <button type="button" id="twice" onclick="alert('first'); alert('second'); window.twice = true">Twice</button>
    <script>
      // beforeunload 只对有过用户激活的页面弹出,所以由点击(可信输入)来布置。
      document.getElementById("arm").addEventListener("click", () => {
        window.onbeforeunload = (e) => { e.preventDefault(); e.returnValue = ""; };
      });
    </script>
  </body>
</html>
