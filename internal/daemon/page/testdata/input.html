<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>input fixture</title>
    <style>
      body { margin: 0; font: 14px sans-serif; }
      #edit { border: 1px solid #888; min-height: 20px; margin: 8px; }
      #box { width: 200px; height: 100px; overflow: auto; margin: 8px; border: 1px solid #888; }
      #box div { height: 400px; }
      .spacer { height: 3000px; }
      .wide { width: 5000px; height: 1px; }
    </style>
  </head>
  <body>
    <input id="name" type="text" value="old" aria-label="Name" />
    <input id="number" type="number" />
    <textarea id="notes">old notes</textarea>
    <div id="edit" contenteditable="true">old editable</div>
    <input id="agree" type="checkbox" />
    <input id="pick" type="radio" name="r" />
    <input id="range" type="range" />
    <div id="plain-div">not editable</div>
    <input id="readonly" type="text" value="fixed" readonly />
    <input id="locked" type="text" value="locked" disabled />
    <input id="file" type="file" />
    <input id="files" type="file" multiple />
    <select id="color">
      <option value="r">Red</option>
      <option value="g">Green</option>
      <option value="b">Blue</option>
    </select>
    <select id="toppings" multiple>
      <option value="cheese">Cheese</option>
      <option value="ham">Ham</option>
      <option value="olive">Olive</option>
    </select>
    <div class="spacer"></div>
    <div class="wide"></div>
    <button type="button" id="far">Far below</button>
    <script>
      // 页面自己记录收到的键盘与输入事件,测试据此判断事件是否可信、按键与修饰键是否如实送达。
      window.events = [];
      const record = (e) =>
        window.events.push({
          type: e.type,
          id: e.target.id,
          key: e.key,
          code: e.code,
          data: e.data,
          trusted: e.isTrusted,
          value: e.target.value,
          modifiers: [e.altKey && "Alt", e.ctrlKey && "Control", e.metaKey && "Meta", e.shiftKey && "Shift"].filter(Boolean),
        });
      for (const type of ["keydown", "keyup", "keypress", "input", "change"]) {
        document.addEventListener(type, record, true);
      }
      window.eventsOf = (type, id) => window.events.filter((e) => e.type === type && (!id || e.id === id));
      document.getElementById("file").addEventListener("change", (e) => {
        window.picked = Array.from(e.target.files).map((f) => f.name);
      });
      document.getElementById("files").addEventListener("change", (e) => {
        window.pickedMany = Array.from(e.target.files).map((f) => f.name);
      });
    </script>
  </body>
</html>
