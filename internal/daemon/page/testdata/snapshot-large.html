<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>large snapshot fixture</title>
  </head>
  <body>
    <nav id="small">
      <button type="button">Only me</button>
      <iframe title="Same frame" src="/snapshot-frame.html"></iframe>
      <iframe title="Cross frame" id="cross" onload="window.crossLoaded = true"></iframe>
    </nav>
    <script>
      // 换一个主机名就是另一个站点:Chrome 把它放进独立进程(OOPIF)。
      document.getElementById("cross").src = `http://localhost:${location.port}/snapshot-frame.html`;
      // 整页的无障碍树远超扩展中转的单帧上限(4 MiB),#small 的子树很小。
      const buttons = [];
      for (let i = 0; i < 32000; i++) buttons.push(`<button type="button">Button number ${i}</button>`);
      document.body.insertAdjacentHTML("beforeend", buttons.join(""));
    </script>
  </body>
</html>
