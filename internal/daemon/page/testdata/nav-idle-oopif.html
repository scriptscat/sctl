<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>nav idle oopif</title>
  </head>
  <body>
    <iframe title="Busy frame" id="busy"></iframe>
    <script>
      // 换一个主机名就是另一个站点:iframe 是独立进程的 iframe,它的请求只在自己的子会话里报告。
      window.childFetchDone = false;
      addEventListener("message", (e) => {
        if (e.data === "fetched") window.childFetchDone = true;
      });
      document.getElementById("busy").src = `http://localhost:${location.port}/nav-idle-oopif-child.html`;
    </script>
  </body>
</html>
