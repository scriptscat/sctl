<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>child</title>
  </head>
  <body>
    <form>
      <label>Name <input type="text" value="child value" /></label>
      <button type="button">Child submit</button>
    </form>
    <iframe title="Nested frame" id="nested"></iframe>
    <script>
      // 记录本 frame 里输入框收到的事件,测试经元素引用在本 frame 里读取。
      window.inputEvents = [];
      for (const type of ["input", "change"]) {
        document.addEventListener(type, (e) => window.inputEvents.push({ type, trusted: e.isTrusted, value: e.target.value }), true);
      }
      // 嵌套 iframe 回到顶层页面的站点,它与父 frame 跨站,仍是独立的 OOPIF。
      document.getElementById("nested").src = `http://127.0.0.1:${location.port}/oopif-nested.html`;
      window.top.postMessage("child", "*");
    </script>
  </body>
</html>
