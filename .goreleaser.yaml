version: 2

project_name: sctl

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: sctl
    main: ./cmd/sctl
    binary: sctl
    env:
      - CGO_ENABLED=0 # 纯静态,避免 glibc 版本绑定
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath # 产物里不出现构建机的绝对路径
    # 版本信息注入到 internal/cli(sctl version / hello 的 daemonVersion 都读它)。
    ldflags:
      - -s -w
      - -X github.com/scriptscat/sctl/internal/cli.Version={{ .Version }}
      - -X github.com/scriptscat/sctl/internal/cli.Commit={{ .FullCommit }}
      - -X github.com/scriptscat/sctl/internal/cli.BuildDate={{ .CommitDate }}
    # 用提交时间而非构建时间,保证同一 tag 重复构建产物逐字节一致(可复现构建)。
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: sctl
    ids: [sctl]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - docs # 整目录递归打包

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "Merge pull request"
  groups:
    - title: 新特性
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  # 草稿发布:CI 产出后由人工确认 changelog 再点发布。
  draft: true
  # v1.2.3-rc.1 / -beta 等自动标记为预发布。
  prerelease: auto
  footer: |
    ## 安装

    从下方 Assets 下载对应平台的压缩包,解压后把 `sctl` 放进 PATH。
    校验产物完整性:

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```

    发布产物由 GitHub Actions 构建并附带构建来源证明(build provenance),
    可用 `gh attestation verify <文件> --repo scriptscat/sctl` 校验。
